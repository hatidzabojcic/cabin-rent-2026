services:
  cabinrent-mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_WEB_PORT}:8025"
    restart: unless-stopped
    networks: [cabinrent-network]

  cabinrent-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - cabinrent-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [cabinrent-network]

  cabinrent-rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [cabinrent-network]

  cabinrent-api:
    build:
      context: .
      dockerfile: backend/CabinRent.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=cabinrent-sql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS}
      Seed__AdminUserName: ${SEED_ADMIN_USERNAME}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__OwnerUserName: ${SEED_OWNER_USERNAME}
      Seed__OwnerPassword: ${SEED_OWNER_PASSWORD}
      Seed__Owner2UserName: ${SEED_OWNER2_USERNAME}
      Seed__Owner2Password: ${SEED_OWNER2_PASSWORD}
      Seed__GuestUserName: ${SEED_GUEST_USERNAME}
      Seed__GuestPassword: ${SEED_GUEST_PASSWORD}
      ImageStorage__RootPath: ${IMAGE_STORAGE_ROOT_PATH}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__Queue: ${RABBITMQ_QUEUE}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      PasswordReset__SmtpHost: cabinrent-mailpit
      PasswordReset__SmtpPort: 1025
      PasswordReset__FromAddress: noreply@cabinrent.local
    ports:
      - "${API_PORT}:8080"
    depends_on:
      cabinrent-mailpit:
        condition: service_started
      cabinrent-sql:
        condition: service_healthy
      cabinrent-rabbitmq:
        condition: service_healthy
    volumes:
      - cabinrent-images:/app/uploads
    networks: [cabinrent-network]

  cabinrent-notifications:
    build:
      context: .
      dockerfile: backend/CabinRent.Notifications/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=cabinrent-sql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__Queue: ${RABBITMQ_QUEUE}
    depends_on:
      cabinrent-sql:
        condition: service_healthy
      cabinrent-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [cabinrent-network]

volumes:
  cabinrent-sql-data:
  cabinrent-images:

networks:
  cabinrent-network:
    driver: bridge
